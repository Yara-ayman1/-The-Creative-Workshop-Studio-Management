{% extends 'base.html' %}
{% block title %}Add Artist — Creative Workshop{% endblock %}
{% block content %}

<div class="form-card">
    <h2>Add Resident Artist</h2>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="form-stack">
        {% csrf_token %}

        <div class="form-group">
            <label>Artist ID</label>
            <input type="number" name="artist_id" class="form-control" placeholder="Unique numeric ID" required>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Specialty <span style="font-weight:400; color:#94a3b8;">(optional)</span></label>
            <input type="text" name="specialty" class="form-control" placeholder="e.g. Pottery, Oil Painting…">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Add Artist</button>
            <a href="{% url 'artist_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
