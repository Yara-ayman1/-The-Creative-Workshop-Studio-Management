<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    </head>
<body>

    {% include 'Navbar.html' %}

    <div class="container" style="padding: 20px;">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}" style="padding: 10px; margin-bottom: 10px; border-radius: 4px; 
                        {% if message.tags == 'error' %} background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                        {% elif message.tags == 'success' %} background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                        {% elif message.tags == 'warning' %} background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
                        {% else %} background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; {% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
