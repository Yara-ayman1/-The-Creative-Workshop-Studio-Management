<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Creative Workshop{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }

        /* ── Navbar ── */
        .navbar { background: #1e293b; padding: 0 24px; display: flex; align-items: center; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); position: sticky; top: 0; z-index: 100; }
        .navbar-brand { color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; margin-right: 24px; white-space: nowrap; }
        .navbar-brand span { color: #38bdf8; }
        .nav-links { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
        .nav-links a { color: #94a3b8; text-decoration: none; padding: 7px 11px; border-radius: 6px; font-size: 13px; font-weight: 500; transition: background 0.15s, color 0.15s; white-space: nowrap; }
        .nav-links a:hover { background: #334155; color: #f1f5f9; }
        .nav-divider { width: 1px; background: #334155; margin: 12px 4px; }

        /* ── Page wrapper ── */
        .page { padding: 28px 32px; max-width: 1300px; margin: 0 auto; }

        /* ── Alerts ── */
        .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; font-weight: 500; }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error   { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .alert-warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .alert-info    { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }

        /* ── Card ── */
        .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
        .card-header { background: #3b82f6; color: #fff; padding: 12px 20px; font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .card-body { padding: 20px; }

        /* ── Tables ── */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #e2e8f0; padding: 11px 14px; text-align: left; }
        th { background: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; }
        tr:hover td { background: #f8fafc; }
        .table-responsive { overflow-x: auto; }

        /* ── Buttons ── */
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; text-decoration: none; transition: opacity 0.15s; font-family: inherit; line-height: 1.4; }
        .btn:hover { opacity: 0.85; }
        .btn-primary   { background: #3b82f6; color: #fff; }
        .btn-success   { background: #22c55e; color: #fff; }
        .btn-warning   { background: #f59e0b; color: #fff; }
        .btn-danger    { background: #ef4444; color: #fff; }
        .btn-secondary { background: #94a3b8; color: #fff; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }

        /* ── Badges ── */
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #dbeafe; color: #1d4ed8; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-red   { background: #fee2e2; color: #b91c1c; }
        .badge-gray  { background: #f1f5f9; color: #64748b; }

        /* ── Forms ── */
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: #475569; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; color: #1e293b; background: #fff; transition: border-color 0.15s; }
        .form-control:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .form-control:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }

        /* ── Page header ── */
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .page-header h2 { font-size: 20px; font-weight: 700; color: #0f172a; }

        /* ── Misc ── */
        .empty-state { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }
        .error-box { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; padding: 10px 14px; border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
        .status-active   { background: #dcfce7; color: #15803d; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .status-inactive { background: #fee2e2; color: #b91c1c; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }

        /* ── Form card (centered forms) ── */
        .form-card { max-width: 500px; margin: 36px auto; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 32px; }
        .form-card h2 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #e2e8f0; }
        .form-stack { display: flex; flex-direction: column; gap: 16px; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
        .form-actions .btn { flex: 1; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    {% include 'Navbar.html' %}
    <div class="page">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
