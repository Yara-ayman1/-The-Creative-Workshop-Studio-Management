{% extends 'base.html' %}
{% block title %}New Workshop — Creative Workshop{% endblock %}
{% block content %}

<div class="form-card" style="max-width: 560px;">
    <h2>New Workshop</h2>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="form-stack">
        {% csrf_token %}

        <div class="form-group">
            <label>Workshop Title</label>
            <input type="text" name="title" class="form-control" placeholder="e.g. Intro to Wheel Throwing" required>
        </div>

        <div class="form-group">
            <label>Craft Type</label>
            <input type="text" name="craft_type" class="form-control" placeholder="e.g. Pottery, Painting, Digital Media…" required>
        </div>

        <div class="form-group">
            <label>Instructor</label>
            <select name="artist_id" class="form-control" required>
                <option value="" disabled selected>Select artist…</option>
                {% for a in artists %}
                <option value="{{ a.0 }}">{{ a.1 }} {{ a.2 }}{% if a.3 %} — {{ a.3 }}{% endif %}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Studio</label>
            <select name="studio_id" class="form-control" required>
                <option value="" disabled selected>Select studio…</option>
                {% for s in studios %}
                <option value="{{ s.0 }}">{{ s.1 }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Max Participants</label>
            <input type="number" name="max_participants" class="form-control" min="1" max="100" required>
        </div>

        <div class="form-group">
            <label>Date</label>
            <input type="date" name="workshop_date" class="form-control" required>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Start Time</label>
                <input type="time" name="start_time" class="form-control" required>
            </div>
            <div class="form-group">
                <label>End Time</label>
                <input type="time" name="end_time" class="form-control" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Create Workshop</button>
            <a href="{% url 'workshop_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
