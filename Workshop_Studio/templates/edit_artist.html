{% extends 'base.html' %}
{% block title %}Edit Artist — Creative Workshop{% endblock %}
{% block content %}

{# artist: 0=artist_id, 1=first_name, 2=last_name, 3=email, 4=specialty #}

<div class="form-card">
    <h2>Edit Artist</h2>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="form-stack">
        {% csrf_token %}

        <div class="form-group">
            <label>Artist ID</label>
            <input type="text" class="form-control" value="{{ artist.0 }}" disabled>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ artist.1 }}" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ artist.2 }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ artist.3 }}" required>
        </div>

        <div class="form-group">
            <label>Specialty <span style="font-weight:400; color:#94a3b8;">(optional)</span></label>
            <input type="text" name="specialty" class="form-control" value="{{ artist.4|default:'' }}" placeholder="e.g. Pottery, Oil Painting…">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Update Artist</button>
            <a href="{% url 'artist_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
