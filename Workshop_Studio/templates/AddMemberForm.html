{% extends 'base.html' %}
{% block title %}Add Member — Creative Workshop{% endblock %}
{% block content %}

<div class="form-card">
    <h2>Add New Member</h2>
    <form method="post" class="form-stack">
        {% csrf_token %}

        <div class="form-row-2">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="tel" name="phone" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Membership Type</label>
            <select name="member_type" class="form-control" required>
                <option value="">Select type…</option>
                <option value="basic">Basic</option>
                <option value="premium">Premium</option>
            </select>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" name="membership_start" class="form-control" required>
            </div>
            <div class="form-group">
                <label>End Date</label>
                <input type="date" name="membership_end" class="form-control" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Add Member</button>
            <a href="{% url 'MembersList' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
