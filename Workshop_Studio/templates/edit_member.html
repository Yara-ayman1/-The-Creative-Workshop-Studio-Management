{% extends 'base.html' %}
{% block title %}Edit Member — Creative Workshop{% endblock %}
{% block content %}

<div class="form-card">
    <h2>Edit Member</h2>
    <form method="POST" class="form-stack">
        {% csrf_token %}

        <div class="form-row-2">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ member.1 }}" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ member.2 }}" required>
            </div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ member.3 }}" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ member.4 }}">
        </div>

        <div class="form-group">
            <label>Membership Type</label>
            <select name="member_type" class="form-control">
                <option value="basic"   {% if member.7 == 'basic' %}selected{% endif %}>Basic</option>
                <option value="premium" {% if member.7 == 'premium' %}selected{% endif %}>Premium</option>
            </select>
        </div>

        <div class="form-row-2">
            <div class="form-group">
                <label>Start Date</label>
                <input type="date" name="membership_start" class="form-control" value="{{ member.5|date:'Y-m-d' }}">
            </div>
            <div class="form-group">
                <label>End Date</label>
                <input type="date" name="membership_end" class="form-control" value="{{ member.6|date:'Y-m-d' }}">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Update Member</button>
            <a href="{% url 'MembersList' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
